<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE GARNET AUDIT // FUSION COMPILER</title>
    <meta name="description" content="An ethical compiler that cross-references relationship dynamics against the wisdom of Garnet (Steven Universe). A tool for auditing codependency, healthy fusion, and the power of being a conversation.">
    <meta name="keywords" content="Garnet, Steven Universe, fusion, relationship audit, healthy relationships, codependency check, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Garnet Audit: Stronger Than You">
    <meta property="og:description" content="I am a conversation. I am made of love. Let's check your fusion stability.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/garnet_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #330033; /* Deep Void Purple */
            color: #ff3366; /* Ruby Red / Sapphire Blue mix */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: linear-gradient(135deg, #330033 0%, #660066 50%, #000033 100%);
        }

        header {
            text-align: center;
            border-bottom: 4px solid #ff3366;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Righteous', cursive;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff3366, #3366ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px rgba(255, 255, 255, 0.1);
        }

        .subtitle {
            color: #fff;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ff3366;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.3);
            border-radius: 20px;
            position: relative;
        }

        /* The Visor Effect */
        .input-container::before {
            content: "👁️";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 10px;
            font-size: 2em;
            color: #3366ff;
            text-shadow: 0 0 10px #ff3366;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #220022;
            color: #fff;
            border: 1px solid #ff3366;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        button {
            background: linear-gradient(to right, #ff3366, #3366ff);
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-family: 'Righteous', cursive;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 50px;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            transform: scale(1.02);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #3366ff;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            color: #fff;
            border-radius: 10px;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #ff3366;
            color: #ff3366;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
            display: block;
            width: 100%;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #ff3366;
            font-family: 'Righteous', cursive;
            text-align: right;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #aaa;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ff3366; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>THE GARNET AUDIT</h1>
        <div class="subtitle">FUSION COMPILER // CRYSTAL GEM LEADER</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#fff;">DESCRIBE THE RELATIONSHIP DYNAMIC:</label>
        <textarea id="inputClaim" placeholder="Paste the situation here (e.g., 'My partner says they can't live without me', 'We argue all the time but the makeup is intense')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()">CHECK THE FUSION</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the wisdom of Garnet. It is a relationship audit, not a future vision.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-council.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "GARNET"; 
        
        // Ensure a persistent user ID for stateful memory (Cloud Function instance life only)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "ADJUSTING FUTURE VISION...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #ff3366;">Checking fusion stability...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Garnet (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: Something is wrong with the warp pad. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "CHECK THE FUSION";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `garnet-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
