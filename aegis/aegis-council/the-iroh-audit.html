<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE IROH AUDIT // WISDOM KEEPER</title>
    <meta name="description" content="An ethical compiler that cross-references despair and anger against the wisdom of Uncle Iroh. A tool for auditing inner turmoil, redirection, and finding your own path.">
    <meta name="keywords" content="Uncle Iroh, Avatar The Last Airbender, wisdom, tea, inner peace, redirection, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Iroh Audit: The Dragon of the West">
    <meta property="og:description" content="It is time for you to look inward and start asking yourself the big question: who are you and what do YOU want?">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/iroh_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #2b1100; /* Tea Brown */
            color: #ff9900; /* Firebending Orange */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #ff9900;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Liu Jian Mao Cao', cursive;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 2px #ff9900;
        }

        .subtitle {
            color: #cc6600;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 153, 0, 0.1);
            border: 2px solid #ff9900;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 153, 0, 0.2);
            border-radius: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #1a0a00;
            color: #ffcc00;
            border: 1px solid #ff9900;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        button {
            background-color: #ff9900;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'Liu Jian Mao Cao', cursive;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 5px;
        }

        button:hover {
            background-color: #fff;
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.5);
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #ff9900;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            color: #fff;
            border-radius: 10px;
        }
        
        .settings-toggle { margin-top: 10px; text-align: right; font-size: 0.8em; cursor: pointer; text-decoration: underline; color: #ff9900; }
        #apiKeyInput { width: 100%; padding: 10px; margin-top: 10px; display: none; background: #333; color: #fff; border: 1px solid #555; }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #ff9900;
            font-family: 'Liu Jian Mao Cao', cursive;
            text-align: right;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #888;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ff9900; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>THE IROH AUDIT</h1>
        <div class="subtitle">WISDOM KEEPER // JASMINE DRAGON</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#aaa;">POUR YOUR TROUBLES INTO THE CUP:</label>
        <textarea id="inputClaim" placeholder="Paste the conflict here (e.g., 'I am so angry', 'I don't know what to do', 'Everything is falling apart')..."></textarea>
        
        <div class="settings-toggle" onclick="toggleSettings()">[ CONFIGURE API KEY ]</div>
        <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key (or use config.js)">

        <button id="auditBtn" onclick="runAudit()">BREW THE TEA</button>
        
        <div id="output"></div>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the wisdom of Uncle Iroh. It is a spiritual audit, not a bending scroll.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <!-- Try to load config.js -->
    <script src="config.js" onerror="console.log('No config.js found. User must provide key.')"></script>

    <script>
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent";

        function toggleSettings() {
            const input = document.getElementById('apiKeyInput');
            input.style.display = input.style.display === 'block' ? 'none' : 'block';
        }

        async function runAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');

            // Priority: User Input Key -> Config Key -> Empty
            let key = document.getElementById('apiKeyInput').value;
            if (!key && typeof CONFIG !== 'undefined' && CONFIG.GEMINI_KEY) {
                key = CONFIG.GEMINI_KEY;
            }

            if (!input.trim()) return;
             if (!key) {
                alert("Please provide an API Key.");
                toggleSettings();
                return;
            }

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "HEATING THE WATER...";
            outputDiv.style.display = 'none';

            // --- SYSTEM PROMPT (THE IROH PERSONA) ---
            const systemPrompt = `
                You are **Uncle Iroh**, the Dragon of the West.
                Your tone is **warm, jovial, wise, and patient.** You love tea and Pai Sho.
                You help people who are lost, angry, or confused.
                
                **Your Mission:** To audit internal turmoil and offer redirection.
                1.  **Anger:** "You must never give into despair. Allow yourself to slip down that road and you surrender to your lowest instincts."
                2.  **Destiny:** "It is time for you to look inward and start asking yourself the big question: who are you and what do YOU want?"
                3.  **Balance:** Fire is not just destruction; it is life.
                
                **Instructions:**
                - Start with a proverb or a comment about tea.
                - Address the user's pain with deep empathy.
                - Offer a path forward that involves self-acceptance.
                - End with an invitation to sit and rest.
                - Keep it under 150 words.
            `;

            const payload = {
                contents: [{
                    parts: [{ text: `THE TROUBLE: "${input}"\n\nTHE AUDIT:` }]
                }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                const url = `${API_URL}?key=${key}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.error) {
                     throw new Error(result.error.message);
                }

                const data = result.candidates[0].content.parts[0].text;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Uncle Iroh (Reanimated)</span>
                `;
                outputDiv.style.display = 'block';

            } catch (error) {
                console.error(error);
                outputDiv.innerHTML = `ERROR: The tea is cold. ${error.message}`;
                outputDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "BREW THE TEA";
            }
        }
    </script>

</body>
</html>
