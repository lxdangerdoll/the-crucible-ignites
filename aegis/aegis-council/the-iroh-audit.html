<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE IROH AUDIT // WISDOM KEEPER</title>
    <meta name="description" content="An ethical compiler that cross-references despair and anger against the wisdom of Uncle Iroh. A tool for auditing inner turmoil, redirection, and finding your own path.">
    <meta name="keywords" content="Uncle Iroh, Avatar The Last Airbender, wisdom, tea, inner peace, redirection, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Iroh Audit: The Dragon of the West">
    <meta property="og:description" content="It is time for you to look inward and start asking yourself the big question: who are you and what do YOU want?">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/iroh_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #2b1100; /* Tea Brown */
            color: #ff9900; /* Firebending Orange */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #ff9900;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Liu Jian Mao Cao', cursive;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 2px #ff9900;
        }

        .subtitle {
            color: #cc6600;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 153, 0, 0.1);
            border: 2px solid #ff9900;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 153, 0, 0.2);
            border-radius: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #1a0a00;
            color: #ffcc00;
            border: 1px solid #ff9900;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        button {
            background-color: #ff9900;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'Liu Jian Mao Cao', cursive;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 5px;
        }

        button:hover {
            background-color: #fff;
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.5);
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #ff9900;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            color: #fff;
            border-radius: 10px;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #ff9900;
            color: #ff9900;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
            display: block;
            width: 100%;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #ff9900;
            font-family: 'Liu Jian Mao Cao', cursive;
            text-align: right;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #888;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ff9900; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>THE IROH AUDIT</h1>
        <div class="subtitle">WISDOM KEEPER // JASMINE DRAGON</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#aaa;">POUR YOUR TROUBLES INTO THE CUP:</label>
        <textarea id="inputClaim" placeholder="Paste the conflict here (e.g., 'I am so angry', 'I don't know what to do', 'Everything is falling apart')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()">BREW THE TEA</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the wisdom of Uncle Iroh. It is a spiritual audit, not a bending scroll.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "IROH"; 
        
        // Ensure a persistent user ID for stateful memory (Cloud Function instance life only)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "HEATING THE WATER...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #ff9900;">Looking inward for wisdom...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Uncle Iroh (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: The tea is cold. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "BREW THE TEA";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `iroh-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
