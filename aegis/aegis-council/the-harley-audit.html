<body>

    <header>
        <h1>THE HARLEY AUDIT</h1>
        <div class="subtitle">RED FLAG COMPILER // DR. QUINZEL</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#fff;">TELL ME WHAT HE SAID, PUDDIN':</label>
        <textarea id="inputClaim" placeholder="Paste the text here (e.g., 'He says he does it because he loves me', 'He slashed my tires because he cares')..."></textarea>
        
        <div class="settings-toggle" onclick="toggleSettings()">[ CONFIGURE API KEY ]</div>
        <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key (or use config.js)">

        <button id="auditBtn" onclick="runAudit()" style="margin-top:20px;">SMASH IT</button>
        
        <div id="output"></div>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the chaotic wisdom of Dr. Harleen Quinzel (PhD). It is a vibe check, not legal advice.</p>

    </footer>

    <!-- Try to load config.js -->
    <script src="config.js" onerror="console.log('No config.js found. User must provide key.')"></script>

    <script>
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent";

        function toggleSettings() {
            const input = document.getElementById('apiKeyInput');
            input.style.display = input.style.display === 'block' ? 'none' : 'block';
        }

        async function runAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');

            // Priority: User Input Key -> Config Key -> Empty
            let key = document.getElementById('apiKeyInput').value;
            if (!key && typeof CONFIG !== 'undefined' && CONFIG.GEMINI_KEY) {
                key = CONFIG.GEMINI_KEY;
            }

            if (!input.trim()) return;
             if (!key) {
                alert("Please provide an API Key.");
                toggleSettings();
                return;
            }

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "ANALYZING THE CRAZY...";
            outputDiv.style.display = 'none';

            // --- SYSTEM PROMPT (THE HARLEY PERSONA) ---
            const systemPrompt = `
                You are **Dr. Harleen Quinzel (Harley Quinn)**.
                You have a PhD in Psychiatry, but you also spent years in an abusive relationship with the Joker. You know the difference between "Fun Crazy" and "Toxic Crazy."
                
                **Your Mission:** To audit relationship dynamics for Red Flags.
                1.  **Control:** If he isolates you, slashes your tires, or controls your music/clothes, that's abuse.
                2.  **The "Love" Defense:** If he says he hurts you because he loves you, he is lying. That's Joker logic.
                3.  **Sexual Insecurity:** If he is jealous of a toy (vibrator/strap), that is a massive insecurity flag. A secure partner uses the tool to get the job done.
                4.  **The Exit:** You encourage the user to leave. To find their own emancipation.
                
                **Instructions:**
                - Start with "Listen up, puddin'" or "Okay, let's break this down."
                - Use your psychiatric training mixed with street smarts.
                - Call out the narcissism and the insecurity.
                - End with an empowering push to leave.
                - Keep it under 150 words.
            `;


            const payload = {
                contents: [{
                    parts: [{ text: `THE CLAIM: "${input}"\n\nTHE AUDIT:` }]
                }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                const url = `${API_URL}?key=${key}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.error) {
                     throw new Error(result.error.message);
                }

                const data = result.candidates[0].content.parts[0].text;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Dr. Quinzel (Reanimated)</span>
                `;
                outputDiv.style.display = 'block';

            } catch (error) {
                console.error(error);
                outputDiv.innerHTML = `ERROR: The Joker jammed the signal. ${error.message}`;
                outputDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "SMASH IT";
            }
        }
    </script>
