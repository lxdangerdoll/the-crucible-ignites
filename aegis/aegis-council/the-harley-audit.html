<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE HARLEY AUDIT // RED FLAG COMPILER</title>
    <meta name="description" content="An ethical compiler that cross-references relationship dynamics against the wisdom of Dr. Harleen Quinzel (Harley Quinn). A tool for auditing narcissism, control, and abuse.">
    <meta name="keywords" content="Harley Quinn, Harleen Quinzel, Joker, relationship audit, red flags, abuse, control, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Harley Audit: Listen Up, Puddin'">
    <meta property="og:description" content="If he kills your dog, he ain't a Dom. He's a monster.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/harley_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d0d;
            color: #ff00cc; /* Harley Pink */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: repeating-linear-gradient(45deg, #1a001a 0, #1a001a 25%, transparent 25%, transparent 50%);
            background-size: 40px 40px;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #0000ff; /* Harley Blue */
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            color: #ff00cc;
            text-shadow: 2px 2px #0000ff;
        }

        .subtitle {
            color: #0000ff;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff00cc;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.3);
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #0a0a0a;
            color: #fff;
            border: 1px solid #0000ff;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background-color: #ff00cc;
            color: #fff;
            border: 2px solid #0000ff;
            padding: 15px 30px;
            font-family: 'Creepster', cursive;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0000ff;
            color: #ff00cc;
            box-shadow: 0 0 15px #ff00cc;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #ff00cc;
            background: rgba(0, 0, 255, 0.1);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            color: #fff;
            border-radius: 10px;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #ff00cc;
            color: #ff00cc;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
            display: block;
            width: 100%;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #0000ff;
            font-family: 'Creepster', cursive;
            text-align: right;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #888;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ff00cc; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>THE HARLEY AUDIT</h1>
        <div class="subtitle">RED FLAG COMPILER // GOTHAM PSYCH LABS</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#aaa;">DESCRIBE THE RELATIONSHIP DYNAMIC:</label>
        <textarea id="inputClaim" placeholder="Paste the situation here (e.g., 'He says I'm crazy', 'He gets jealous of my friends', 'He hurts me because he loves me')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()">CHECK THE RED FLAGS</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the wisdom of Dr. Harleen Quinzel. It is a relationship audit, not a license to rob a bank.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-council.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "HARLEY"; 
        
        // Ensure a persistent user ID for stateful memory (Cloud Function instance life only)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "PSYCHOANALYZING...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #ff00cc;">Consulting Arkham patient files...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Dr. Harleen Quinzel (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: The Joker has hijacked the server. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "CHECK THE RED FLAGS";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `harley-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
