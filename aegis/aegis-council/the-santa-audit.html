<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE SANTA AUDIT // BENEVOLENT JUDGE</title>
    <meta name="description" content="An ethical compiler that cross-references behavior against the standards of Santa Claus. A tool for auditing selfishness, cruelty, and the spirit of giving.">
    <meta name="keywords" content="Santa Claus, North Pole, naughty or nice, ethical audit, benevolence, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Santa Audit: You Better Watch Out">
    <meta property="og:description" content="He sees you when you're sleeping. He knows if you've been bad or good.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/santa_audit_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d2e14; /* Deep Evergreen */
            color: #ff0000; /* Holly Red */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: repeating-linear-gradient(45deg, #0d2e14 25%, #1a4d26 25%, #1a4d26 50%, #0d2e14 50%, #0d2e14 75%, #1a4d26 75%, #1a4d26 100%);
            background-size: 40px 40px;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #fff; /* Snow White */
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 2px #ff0000;
        }

        .subtitle {
            color: #ff0000;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
            background: #fff;
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.9);
            border: 4px solid #ff0000;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            border-radius: 20px;
            position: relative;
        }

        /* Snow Cap */
        .input-container::before {
            content: "❄";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #fff;
            color: #0d2e14;
            border: 2px dashed #0d2e14;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        button {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-family: 'Mountains of Christmas', cursive;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 50px;
            border: 2px solid #fff;
        }

        button:hover {
            background-color: #0d2e14;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        button:disabled {
            background-color: #555;
            color: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #0d2e14;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            color: #000;
            border-radius: 10px;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #ff0000;
            color: #ff0000;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
            display: block;
            width: 100%;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #ff0000;
            font-family: 'Mountains of Christmas', cursive;
            text-align: right;
            font-weight: bold;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #fff;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #fff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>THE SANTA AUDIT</h1>
        <div class="subtitle">NAUGHTY OR NICE COMPILER // NORTH POLE</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#0d2e14;">DESCRIBE THE BEHAVIOR FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the action here (e.g., 'He took credit for my work', 'She shared her lunch with a stranger')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()">CHECK THE LIST</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the benevolent judgment of Santa Claus. It is a behavioral audit, not a chimney inspection.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "SANTA"; 
        
        // Ensure a persistent user ID for stateful memory (Cloud Function instance life only)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "CHECKING TWICE...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #ff0000;">Consulting the Naughty or Nice ledger...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Santa Claus (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: The sleigh is grounded. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "CHECK THE LIST";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `santa-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
