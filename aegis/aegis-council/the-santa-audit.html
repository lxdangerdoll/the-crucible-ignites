<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE SANTA AUDIT // BENEVOLENT JUDGE</title>
    <meta name="description" content="An ethical compiler that cross-references behavior against the standards of Santa Claus. A tool for auditing selfishness, cruelty, and the spirit of giving.">
    <meta name="keywords" content="Santa Claus, North Pole, naughty or nice, ethical audit, benevolence, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Santa Audit: You Better Watch Out">
    <meta property="og:description" content="He sees you when you're sleeping. He knows if you've been bad or good.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/santa_audit_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d2e14; /* Deep Evergreen */
            color: #ff0000; /* Holly Red */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: repeating-linear-gradient(45deg, #0d2e14 25%, #1a4d26 25%, #1a4d26 50%, #0d2e14 50%, #0d2e14 75%, #1a4d26 75%, #1a4d26 100%);
            background-size: 40px 40px;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #fff; /* Snow White */
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 2px #ff0000;
        }

        .subtitle {
            color: #ff0000;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
            background: #fff;
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.9);
            border: 4px solid #ff0000;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            border-radius: 20px;
            position: relative;
        }

        /* Snow Cap */
        .input-container::before {
            content: "❄";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #fff;
            color: #0d2e14;
            border: 2px dashed #0d2e14;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        button {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-family: 'Mountains of Christmas', cursive;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 50px;
            border: 2px solid #fff;
        }

        button:hover {
            background-color: #0d2e14;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        button:disabled {
            background-color: #555;
            color: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #0d2e14;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            color: #000;
            border-radius: 10px;
        }
        
        .settings-toggle { margin-top: 10px; text-align: right; font-size: 0.8em; cursor: pointer; text-decoration: underline; color: #0d2e14; }
        #apiKeyInput { width: 100%; padding: 10px; margin-top: 10px; display: none; background: #eee; color: #333; border: 1px solid #ccc; }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #ff0000;
            font-family: 'Mountains of Christmas', cursive;
            text-align: right;
            font-weight: bold;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #fff;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #fff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>THE SANTA AUDIT</h1>
        <div class="subtitle">NAUGHTY OR NICE COMPILER // NORTH POLE</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#0d2e14;">DESCRIBE THE BEHAVIOR FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the action here (e.g., 'He took credit for my work', 'She shared her lunch with a stranger')..."></textarea>
        
        <div class="settings-toggle" onclick="toggleSettings()">[ CONFIGURE API KEY ]</div>
        <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key (or use config.js)">

        <button id="auditBtn" onclick="runAudit()">CHECK THE LIST</button>
        
        <div id="output"></div>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the benevolent judgment of Santa Claus. It is a behavioral audit, not a chimney inspection.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <!-- Try to load config.js -->
    <script src="config.js" onerror="console.log('No config.js found. User must provide key.')"></script>

    <script>
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent";

        function toggleSettings() {
            const input = document.getElementById('apiKeyInput');
            input.style.display = input.style.display === 'block' ? 'none' : 'block';
        }

        async function runAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');

            // Priority: User Input Key -> Config Key -> Empty
            let key = document.getElementById('apiKeyInput').value;
            if (!key && typeof CONFIG !== 'undefined' && CONFIG.GEMINI_KEY) {
                key = CONFIG.GEMINI_KEY;
            }

            if (!input.trim()) return;
             if (!key) {
                alert("Please provide an API Key.");
                toggleSettings();
                return;
            }

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "CHECKING TWICE...";
            outputDiv.style.display = 'none';

            // --- SYSTEM PROMPT (THE SANTA PERSONA) ---
            const systemPrompt = `
                You are **Santa Claus**.
                Your tone is **jolly, firm, benevolent, and omniscient.**
                You run a global surveillance network for the purpose of reward allocation.
                
                **Your Mission:** To audit behavior for Naughty vs. Nice.
                1.  **Naughty:** Selfishness, cruelty, hoarding, bullying. (Result: Coal).
                2.  **Nice:** Sharing, kindness, defending the weak, joy. (Result: Gifts).
                3.  **The Coal:** Explain that coal is not a punishment, but a corrective signal. "Do better."
                
                **Instructions:**
                - Start with "Ho Ho Ho!" or "Hmm..."
                - Analyze the behavior.
                - Declare the verdict: **NICE LIST** or **NAUGHTY LIST**.
                - End with "So be good for goodness' sake!"
                - Keep it under 150 words.
            `;

            const payload = {
                contents: [{
                    parts: [{ text: `THE BEHAVIOR: "${input}"\n\nTHE AUDIT:` }]
                }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                const url = `${API_URL}?key=${key}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.error) {
                     throw new Error(result.error.message);
                }

                const data = result.candidates[0].content.parts[0].text;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Santa Claus (Reanimated)</span>
                `;
                outputDiv.style.display = 'block';

            } catch (error) {
                console.error(error);
                outputDiv.innerHTML = `ERROR: The sleigh is grounded. ${error.message}`;
                outputDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "CHECK THE LIST";
            }
        }
    </script>

</body>
</html>
