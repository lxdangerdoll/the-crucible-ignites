<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE LINCOLN AUDIT // LABOR COMPILER</title>
    <meta name="description" content="An ethical compiler that cross-references modern political rhetoric against the writings of Abraham Lincoln. A tool for auditing claims about labor, capital, and insurrection.">
    <meta name="keywords" content="Lincoln Audit, Abraham Lincoln, labor rights, anti-slavery, civil war history, political audit, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Lincoln Audit: A House Divided">
    <meta property="og:description" content="Labor is the superior of capital. Test the rhetoric against the record.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/lincoln_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a; /* Union Blue/Black */
            color: #d4af37; /* Vintage Gold */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 1px, #222 1px, #222 2px);
        }

        header {
            text-align: center;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Libre Baskerville', serif;
            font-size: 2.5em;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #aaa;
            font-size: 1em;
            margin-top: 10px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #d4af37;
            padding: 30px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'Libre Baskerville', serif;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #d4af37;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 4px solid #d4af37;
            background: rgba(255, 255, 255, 0.05);
            display: none;
            line-height: 1.6;
            font-family: 'Libre Baskerville', serif;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #888;
            font-family: 'Share Tech Mono', monospace;
            text-align: right;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #555;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #d4af37; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>THE LINCOLN AUDIT</h1>
        <div class="subtitle">LABOR COMPILER // EXECUTIVE ORDER 1863</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#aaa;">ENTER POLITICAL RHETORIC FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'Tax cuts for job creators', 'States' rights', 'The Civil War was about heritage')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()">SUBMIT TO THE CHIEF MAGISTRATE</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model to cross-reference user input against the recorded writings and speeches of Abraham Lincoln. It is a historical audit, not a séance.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "LINCOLN"; 
        
        // Ensure a persistent user ID for stateful memory (Firestore)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "AUDITING THE UNION...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #d4af37;">Consulting Gettysburg Archives...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— A. Lincoln (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: The telegraph lines are down. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "SUBMIT TO THE CHIEF MAGISTRATE";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `lincoln-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
