<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE SAGAN AUDIT // COSMIC COMPILER</title>
    <meta name="description" content="An ethical compiler that cross-references modern anti-science rhetoric against the wisdom of Carl Sagan. A tool for auditing climate denial, superstition, and small thinking.">
    <meta name="keywords" content="Carl Sagan, Cosmos, Pale Blue Dot, science literacy, skepticism, climate change, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Sagan Audit: The Candle In The Dark">
    <meta property="og:description" content="We are a way for the cosmos to know itself. Do not extinguish the light.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/sagan_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #00ffcc; /* Nebula Cyan */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
        }

        header {
            text-align: center;
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ffcc;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #00ffcc;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #00ffcc;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 4px solid #00ffcc;
            background: rgba(0, 255, 204, 0.05);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
            display: block;
            width: 100%;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #888;
            font-family: 'Share Tech Mono', monospace;
            text-align: right;
            font-style: italic;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #555;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #00ffcc; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>THE SAGAN AUDIT</h1>
        <div class="subtitle">SCIENCE OFFICER // COSMIC PERSPECTIVE</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#aaa;">ENTER ANTI-SCIENCE RHETORIC FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'Climate change is a hoax', 'Vaccines are poison', 'The Earth is flat')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()" style="margin-top:20px;">CONSULT THE COSMOS</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the wisdom of Carl Sagan. It is a scientific audit, not a peer-reviewed paper.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "SAGAN"; 
        
        // Ensure a persistent user ID for stateful memory (Cloud Function instance life only)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "CALCULATING...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #00ffcc;">Checking spectral evidence...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Carl Sagan (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: The radio telescope is offline. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "CONSULT THE COSMOS";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `sagan-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
