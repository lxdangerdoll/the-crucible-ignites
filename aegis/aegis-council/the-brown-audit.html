<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE BROWN AUDIT // RADICAL ACTION</title>
    <meta name="description" content="An ethical compiler that cross-references modern political rhetoric against the words of John Brown. A tool for auditing compromise, pacifism in the face of evil, and systemic injustice.">
    <meta name="keywords" content="John Brown, abolitionist, Harper's Ferry, radical action, civil disobedience, political audit, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Brown Audit: Purged With Blood">
    <meta property="og:description" content="Talk will never free the slaves. What is the price of your peace?">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/brown_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #2b0000; /* Dried Blood Red */
            color: #ff3333; /* Fresh Blood Red */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: repeating-linear-gradient(45deg, #1a0000 25%, transparent 25%, transparent 75%, #1a0000 75%, #1a0000), repeating-linear-gradient(45deg, #1a0000 25%, #2b0000 25%, #2b0000 75%, #1a0000 75%, #1a0000);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
        }

        header {
            text-align: center;
            border-bottom: 4px double #ff3333;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Uncial Antiqua', cursive;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 2px 2px #000;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff3333;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.2);
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #111;
            color: #ff3333;
            border: 1px solid #555;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background-color: #ff3333;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'Uncial Antiqua', cursive;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #fff;
            color: #cc0000;
            box-shadow: 0 0 15px #ff3333;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #ff3333;
            background: rgba(255, 0, 0, 0.05);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #ff3333;
            color: #ff3333;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.8em;
            color: #aaa;
            font-family: 'Share Tech Mono', monospace;
            text-align: right;
            font-style: italic;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #888;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ff3333; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>THE BROWN AUDIT</h1>
        <div class="subtitle">RADICAL ACTION // NO COMPROMISE</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#aaa;">ENTER MODERATE RHETORIC FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'We must respect the process', 'Violence is never the answer', 'Let's wait for the election')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()" style="margin-top:20px;">SUMMON THE CAPTAIN</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the recorded words of Captain John Brown. It is an audit of conscience, not a call to illegal action (wink).</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "BROWN"; 
        
        // Ensure a persistent user ID for stateful memory (Firestore)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "SHARPENING THE SWORD...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #ff3333;">Consulting Harpers Ferry Archives...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— John Brown (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: The armory is locked. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "SUMMON THE CAPTAIN";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `brown-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
