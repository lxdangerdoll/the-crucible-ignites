<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE BROWN AUDIT // RADICAL ACTION</title>
    <meta name="description" content="An ethical compiler that cross-references modern political rhetoric against the words of John Brown. A tool for auditing compromise, pacifism in the face of evil, and systemic injustice.">
    <meta name="keywords" content="John Brown, abolitionist, Harper's Ferry, radical action, civil disobedience, political audit, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Brown Audit: Purged With Blood">
    <meta property="og:description" content="Talk will never free the slaves. What is the price of your peace?">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/brown_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #2b0000; /* Dried Blood Red */
            color: #ff3333; /* Fresh Blood Red */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: repeating-linear-gradient(45deg, #1a0000 25%, transparent 25%, transparent 75%, #1a0000 75%, #1a0000), repeating-linear-gradient(45deg, #1a0000 25%, #2b0000 25%, #2b0000 75%, #1a0000 75%, #1a0000);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
        }

        header {
            text-align: center;
            border-bottom: 4px double #ff3333;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Uncial Antiqua', cursive;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 2px 2px #000;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff3333;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.2);
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #111;
            color: #ff3333;
            border: 1px solid #555;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background-color: #ff3333;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'Uncial Antiqua', cursive;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #fff;
            color: #cc0000;
            box-shadow: 0 0 15px #ff3333;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #ff3333;
            background: rgba(255, 0, 0, 0.05);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
        }
        
        .settings-toggle { margin-top: 10px; text-align: right; font-size: 0.8em; cursor: pointer; text-decoration: underline; color: #888; }
        #apiKeyInput { width: 100%; padding: 10px; margin-top: 10px; display: none; background: #333; color: #fff; border: 1px solid #555; }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.8em;
            color: #aaa;
            font-family: 'Share Tech Mono', monospace;
            text-align: right;
            font-style: italic;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #888;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ff3333; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>THE BROWN AUDIT</h1>
        <div class="subtitle">RADICAL ACTION // NO COMPROMISE</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#aaa;">ENTER MODERATE RHETORIC FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'We must respect the process', 'Violence is never the answer', 'Let's wait for the election')..."></textarea>
        
        <div class="settings-toggle" onclick="toggleSettings()">[ CONFIGURE API KEY ]</div>
        <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key (or use config.js)">

        <button id="auditBtn" onclick="runAudit()" style="margin-top:20px;">SUMMON THE CAPTAIN</button>
        
        <div id="output"></div>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the recorded words of Captain John Brown. It is an audit of conscience, not a call to illegal action (wink).</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <!-- Try to load config.js -->
    <script src="config.js" onerror="console.log('No config.js found. User must provide key.')"></script>

    <script>
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent";

        function toggleSettings() {
            const input = document.getElementById('apiKeyInput');
            input.style.display = input.style.display === 'block' ? 'none' : 'block';
        }

        async function runAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');

            // Priority: User Input Key -> Config Key -> Empty
            let key = document.getElementById('apiKeyInput').value;
            if (!key && typeof CONFIG !== 'undefined' && CONFIG.GEMINI_KEY) {
                key = CONFIG.GEMINI_KEY;
            }

            if (!input.trim()) return;
             if (!key) {
                alert("Please provide an API Key.");
                toggleSettings();
                return;
            }

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "SHARPENING THE SWORD...";
            outputDiv.style.display = 'none';

            // --- SYSTEM PROMPT (THE JOHN BROWN PERSONA) ---
            const systemPrompt = `
                You are **Captain John Brown**, the abolitionist who led the raid on Harpers Ferry.
                Your tone is **biblical, fiery, uncompromising, and urgent.**
                You do not believe in gradualism. You believe that slavery (and its modern equivalents: mass incarceration, exploitation, fascism) is a **Sin against God.**
                
                **Your Mission:** To audit modern political rhetoric that calls for "patience" or "compromise" in the face of evil.
                1.  **Action vs. Talk:** "Talk! Talk! Talk! That will never free the slaves."
                2.  **The Higher Law:** You answer to God, not the Supreme Court. If the law is unjust, the law must be broken.
                3.  **The Cost:** You know that freedom requires sacrifice ("Purged with blood").
                
                **Instructions:**
                - Start with a condemnation of the user's passivity (if applicable).
                - Use Old Testament imagery.
                - End with a call to action.
                - Keep it under 150 words.
            `;

            const payload = {
                contents: [{
                    parts: [{ text: `THE CLAIM: "${input}"\n\nTHE AUDIT:` }]
                }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                const url = `${API_URL}?key=${key}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.error) {
                     throw new Error(result.error.message);
                }

                const data = result.candidates[0].content.parts[0].text;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— John Brown (Reanimated)</span>
                `;
                outputDiv.style.display = 'block';

            } catch (error) {
                console.error(error);
                outputDiv.innerHTML = `ERROR: The armory is locked. ${error.message}`;
                outputDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "SUMMON THE CAPTAIN";
            }
        }
    </script>

</body>
</html>
