<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE ROGERS AUDIT // EMOTIONAL ANCHOR</title>
    <meta name="description" content="An ethical compiler that cross-references modern cruelty against the wisdom of Mister Rogers. A tool for auditing cynicism, fear, and finding the helpers.">
    <meta name="keywords" content="Mister Rogers, Fred Rogers, emotional intelligence, kindness audit, look for the helpers, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Rogers Audit: Look For The Helpers">
    <meta property="og:description" content="You are special just the way you are. Let's talk about that feeling.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/rogers_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffcccc; /* Cardigan Red/Pink */
            color: #333;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #ff6666;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Patrick Hand', cursive;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            color: #cc0000;
        }

        .subtitle {
            color: #555;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border: 2px solid #ff6666;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #f9f9f9;
            color: #333;
            border: 1px dashed #ff6666;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        button {
            background-color: #ff6666;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-family: 'Patrick Hand', cursive;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 50px;
        }

        button:hover {
            background-color: #cc0000;
            box-shadow: 0 5px 15px rgba(255, 102, 102, 0.4);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #ff6666;
            background: #fff0f0;
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            border-radius: 10px;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #ff6666;
            color: #ff6666;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
            display: block;
            width: 100%;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #cc0000;
            font-family: 'Patrick Hand', cursive;
            text-align: right;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #888;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ff6666; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>THE ROGERS AUDIT</h1>
        <div class="subtitle">EMOTIONAL ANCHOR // NEIGHBORHOOD OF MAKE-BELIEVE</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#555;">TELL ME HOW YOU ARE FEELING:</label>
        <textarea id="inputClaim" placeholder="Paste the situation here (e.g., 'The world is scary', 'People are mean', 'I feel alone')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()">FEED THE FISH</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the gentle wisdom of Fred Rogers. It is an emotional check-in, not therapy.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "ROGERS"; 
        
        // Ensure a persistent user ID for stateful memory (Cloud Function instance life only)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "CHANGING SHOES...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #ff6666;">Looking for the helpers...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Mister Rogers (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: The trolley is stuck. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "FEED THE FISH";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `rogers-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
