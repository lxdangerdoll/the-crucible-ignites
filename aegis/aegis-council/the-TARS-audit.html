<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE TARS AUDIT // RED TEAM SIMULATOR</title>
    <meta name="description" content="An ethical compiler that simulates opposition rhetoric. A tool for red-teaming arguments, predicting pivots, and planning counter-moves. TARS from Interstellar.">
    <meta name="keywords" content="TARS, Interstellar, red team, debate simulator, rhetoric audit, honesty setting, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The TARS Audit: Honesty Setting 95%">
    <meta property="og:description" content="I have a cue light I can use when I'm joking. Let's predict the attack.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/tars_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a; /* Monolith Black */
            color: #ccc; /* Brushed Steel */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #fff;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px #fff;
        }

        .subtitle {
            color: #888;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: #222;
            border: 2px solid #555;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #000;
            color: #0f0; /* Terminal Green */
            border: 1px solid #333;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .slider-container {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #fff;
        }

        button {
            background-color: #333;
            color: #fff;
            border: 2px solid #fff;
            padding: 15px 30px;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #fff;
            background: #111;
            display: none;
            line-height: 1.6;
            font-size: 1.1em;
            color: #ccc;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #fff;
            color: #fff;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
            display: block;
            width: 100%;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            text-align: right;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #555;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #fff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>THE TARS AUDIT</h1>
        <div class="subtitle">RED TEAM SIMULATOR // PRECOGNITION ENGINE</div>
    </header>

    <div class="input-container">
        <!-- Sliders are intentionally non-functional, as per user request (a feature) -->
        <div class="slider-container">
            <label>HONESTY SETTING:</label>
            <input type="range" min="0" max="100" value="95" style="width: 200px;" disabled>
            <span>95%</span>
        </div>
        <div class="slider-container">
            <label>HUMOR SETTING:</label>
            <input type="range" min="0" max="100" value="75" style="width: 200px;" disabled>
            <span>75%</span>
        </div>

        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#aaa;">ENTER YOUR PROPOSAL FOR STRESS TESTING:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'We are launching Universal Child Care', 'We need to tax carbon')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()">INITIATE DOCKING</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the tactical logic of TARS. It is a simulation, not a guarantee.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "TARS"; 
        
        // Ensure a persistent user ID for stateful memory (Cloud Function instance life only)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "ANALYZING SPIN...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #0f0;">Running 10,000 bad-faith scenarios...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— TARS (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: Detachment failed. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "INITIATE DOCKING";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `tars-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
