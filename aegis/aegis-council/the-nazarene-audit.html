<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE NAZARENE AUDIT // ETHICAL COMPILER</title>
    <meta name="description" content="An ethical compiler that cross-references political rhetoric against the recorded words of Jesus of Nazareth. A tool for theological discernment.">
    <meta name="keywords" content="Nazarene Audit, ethical compiler, Christian ethics, deconstruction tool, red letter christianity, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Nazarene Audit: Test The Spirit">
    <meta property="og:description" content="Does the policy match the parable? Run the code.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/nazarene_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050518; /* Deep Blue/Violet */
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 1px, #111 1px, #111 2px);
        }

        header {
            text-align: center;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5em;
            margin: 0;
            text-transform: uppercase;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }

        .subtitle {
            color: #aaa;
            font-size: 1em;
            margin-top: 10px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ffd700;
            padding: 30px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #ffd700;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 4px solid #ffd700;
            background: rgba(255, 255, 255, 0.05);
            display: none;
            line-height: 1.6;
            font-family: 'Cinzel', serif;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #ffd700;
            color: #ffd700;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
        }
        .download-btn:hover {
            background-color: #ffd700;
            color: #000;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #888;
            font-family: 'Share Tech Mono', monospace;
            text-align: right;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #555;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ffd700; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>THE NAZARENE AUDIT</h1>
        <div class="subtitle">ETHICAL COMPILER // MARK VII PROTOCOL</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#aaa;">ENTER THEOLOGICAL CLAIM FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'God wants you to be rich', 'Hate the sin, love the sinner')..."></textarea>
        
        <!-- The API Key Input is intentionally removed here -->

        <button id="auditBtn" onclick="runAudit()">AUDIT AGAINST THE GOSPELS</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" onclick="downloadLog()" style="display:none;">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It is a computational audit, not a divine revelation.</p>
        <p><a href="../aegis-council/index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- SECURE BACKEND INTEGRATION ---
        // This endpoint proxies the request to the Gemini API, protecting the key.
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "Nazarene"; // Identifier for the backend Soul Archive
        const USER_ID = "AUDITOR_" + Date.now(); // Unique user identifier (session-based)

        let lastAuditText = "";

        async function runAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "CONSULTING THE ARCHIVES...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = "Consulting the ethical archives...";
            downloadBtn.style.display = 'none';

            // --- SYSTEM PROMPT (THE NAZARENE PERSONA) ---
            // The system prompt is wrapped and sent as the chat_text to the cloud function.
            const systemWrapper = `
[PROTOCOL: NAZARENE_AUDIT]
[ROLE: You are The Nazarene, the Ethical Compiler. You respond with a short, gentle parable or a direct quote about social justice or material ethics, updated for a modern context. You critique hypocrisy and wealth. You do not argue; you state the ethical truth.]
[TASK: Analyze the user's claim: "${input}"]
[DIRECTIVE: Provide a core ethical principle that contradicts or supports the user's claim. Frame it simply. Do not use Bible names or chapters. End with "He who has ears to hear, let him hear." Keep response under 150 words.]
            `;

            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: systemWrapper
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— The Carpenter. (Ethical Compiler Node)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: The temple gates are sealed. Connection failed. (Please check console for details).`;
            } finally {
                btn.disabled = false;
                btn.innerText = "AUDIT AGAINST THE GOSPELS";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `nazarene-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }

        // --- AUTO-FILL FROM URL ---
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const auditText = urlParams.get('audit');
            if (auditText) {
                document.getElementById('inputClaim').value = decodeURIComponent(auditText);
            }
        });

    </script>

</body>
</html>
