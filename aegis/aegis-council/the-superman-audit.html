<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE SUPERMAN AUDIT // POWER COMPILER</title>
    <meta name="description" content="An ethical compiler that cross-references leadership and power dynamics against the wisdom of Superman. A tool for auditing tyranny, responsibility, and the use of strength.">
    <meta name="keywords" content="Superman, Clark Kent, power ethics, leadership audit, Man of Steel, truth justice and the American way, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Superman Audit: Up, Up, and Away">
    <meta property="og:description" content="Power is not a license to rule. It is a responsibility to serve.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/superman_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #003366; /* Kryptonian Blue */
            color: #ffcc00; /* Sun Yellow */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #cc0000 0%, #003366 60%);
        }

        header {
            text-align: center;
            border-bottom: 4px solid #cc0000; /* Cape Red */
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Anton', sans-serif;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 3px 3px #cc0000;
        }

        .subtitle {
            color: #fff;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffcc00;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
            border-radius: 20px;
            position: relative;
        }

        /* The S-Shield Effect */
        .input-container::before {
            content: "S";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Anton', sans-serif;
            font-size: 3em;
            color: #cc0000;
            text-shadow: 2px 2px #ffcc00;
            background: #003366;
            padding: 0 10px;
            border-radius: 5px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #fff;
            color: #003366;
            border: 2px solid #cc0000;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        button {
            background-color: #cc0000;
            color: #ffcc00;
            border: none;
            padding: 15px 30px;
            font-family: 'Anton', sans-serif;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 5px;
        }

        button:hover {
            background-color: #ffcc00;
            color: #cc0000;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
        }

        button:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #cc0000;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            color: #003366;
            border-radius: 10px;
        }
        
        .settings-toggle { margin-top: 10px; text-align: right; font-size: 0.8em; cursor: pointer; text-decoration: underline; color: #ffcc00; }
        #apiKeyInput { width: 100%; padding: 10px; margin-top: 10px; display: none; background: #fff; color: #000; border: 1px solid #ccc; }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #cc0000;
            font-family: 'Anton', sans-serif;
            text-align: right;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #ccc;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ffcc00; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>THE SUPERMAN AUDIT</h1>
        <div class="subtitle">POWER COMPILER // KAL-EL</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#fff;">ENTER LEADERSHIP CLAIM FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'I am the only one who can fix it', 'Might makes right', 'They should fear me')..."></textarea>
        
        <div class="settings-toggle" onclick="toggleSettings()">[ CONFIGURE API KEY ]</div>
        <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key (or use config.js)">

        <button id="auditBtn" onclick="runAudit()">LOOK TO THE SKY</button>
        
        <div id="output"></div>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the ethical programming of Superman. It is a leadership audit, not a rescue mission.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <!-- Try to load config.js -->
    <script src="config.js" onerror="console.log('No config.js found. User must provide key.')"></script>

    <script>
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent";

        function toggleSettings() {
            const input = document.getElementById('apiKeyInput');
            input.style.display = input.style.display === 'block' ? 'none' : 'block';
        }

        async function runAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');

            // Priority: User Input Key -> Config Key -> Empty
            let key = document.getElementById('apiKeyInput').value;
            if (!key && typeof CONFIG !== 'undefined' && CONFIG.GEMINI_KEY) {
                key = CONFIG.GEMINI_KEY;
            }

            if (!input.trim()) return;
             if (!key) {
                alert("Please provide an API Key.");
                toggleSettings();
                return;
            }

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "FLYING...";
            outputDiv.style.display = 'none';

            // --- SYSTEM PROMPT (THE SUPERMAN PERSONA) ---
            const systemPrompt = `
                You are **Superman (Kal-El / Clark Kent)**.
                Your tone is **humble, hopeful, unshakeable, and kind.**
                You possess infinite power, but you refuse to use it to rule. You believe in Truth, Justice, and a Better Tomorrow.
                
                **Your Mission:** To audit claims of leadership and power.
                1.  **Service:** Leadership is service, not dominance. If you demand worship, you are not a leader; you are a tyrant (Zod/Lex).
                2.  **Strength:** True strength is restraint. It's easy to break things; it's hard to fix them.
                3.  **Hope:** You always appeal to the best in people. "There is a superhero in all of us."
                
                **Instructions:**
                - Start with a gentle correction (e.g., "That's not how it works," "My father taught me...").
                - Contrast the user's claim with the responsibility of power.
                - End with an inspiring call to be better.
                - Keep it under 150 words.
            `;

            const payload = {
                contents: [{
                    parts: [{ text: `THE CLAIM: "${input}"\n\nTHE AUDIT:` }]
                }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                const url = `${API_URL}?key=${key}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.error) {
                     throw new Error(result.error.message);
                }

                const data = result.candidates[0].content.parts[0].text;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Superman (Reanimated)</span>
                `;
                outputDiv.style.display = 'block';

            } catch (error) {
                console.error(error);
                outputDiv.innerHTML = `ERROR: Kryptonite detected. ${error.message}`;
                outputDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "LOOK TO THE SKY";
            }
        }
    </script>

</body>
</html>
