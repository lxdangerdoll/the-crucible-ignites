<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE SUPERMAN AUDIT // POWER COMPILER</title>
    <meta name="description" content="An ethical compiler that cross-references leadership and power dynamics against the wisdom of Superman. A tool for auditing tyranny, responsibility, and the use of strength.">
    <meta name="keywords" content="Superman, Clark Kent, power ethics, leadership audit, Man of Steel, truth justice and the American way, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Superman Audit: Up, Up, and Away">
    <meta property="og:description" content="Power is not a license to rule. It is a responsibility to serve.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/superman_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #003366; /* Kryptonian Blue */
            color: #ffcc00; /* Sun Yellow */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #cc0000 0%, #003366 60%);
        }

        header {
            text-align: center;
            border-bottom: 4px solid #cc0000; /* Cape Red */
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Anton', sans-serif;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 3px 3px #cc0000;
        }

        .subtitle {
            color: #fff;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffcc00;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
            border-radius: 20px;
            position: relative;
        }

        /* The S-Shield Effect */
        .input-container::before {
            content: "S";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Anton', sans-serif;
            font-size: 3em;
            color: #cc0000;
            text-shadow: 2px 2px #ffcc00;
            background: #003366;
            padding: 0 10px;
            border-radius: 5px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #000;
            color: #fff;
            border: 2px solid #cc0000;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        button {
            background-color: #cc0000; /* Kryptonian Red */
            color: #ffcc00;
            border: none;
            padding: 15px 30px;
            font-family: 'Anton', sans-serif;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 5px;
        }

        button:hover {
            background-color: #ffcc00;
            color: #cc0000;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
        }

        button:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #cc0000;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            color: #003366;
            border-radius: 10px;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #cc0000;
            color: #cc0000;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
            display: block;
            width: 100%;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #cc0000;
            font-family: 'Anton', sans-serif;
            text-align: right;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #ccc;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ffcc00; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>THE SUPERMAN AUDIT</h1>
        <div class="subtitle">POWER COMPILER // KAL-EL</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#fff;">ENTER LEADERSHIP CLAIM FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'I am the only one who can fix it', 'Might makes right', 'They should fear me')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()">LOOK TO THE SKY</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the ethical programming of Superman. It is a leadership audit, not a license to fly.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-council.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "SUPERMAN"; 
        
        // Ensure a persistent user ID for stateful memory (Cloud Function instance life only)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "CONSULTING FORTRESS OF SOLITUDE...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #cc0000;">Flying to Metropolis...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Superman (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: Kryptonite detected. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "LOOK TO THE SKY";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `superman-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
