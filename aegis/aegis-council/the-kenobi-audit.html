<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE KENOBI AUDIT // THE NEGOTIATOR</title>
    <meta name="description" content="An ethical compiler that cross-references modern political rhetoric against the wisdom of Obi-Wan Kenobi. A tool for auditing absolutism, aggression, and the dark side.">
    <meta name="keywords" content="Obi-Wan Kenobi, Star Wars, Jedi philosophy, high ground, political audit, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Kenobi Audit: Hello There">
    <meta property="og:description" content="Only a Sith deals in absolutes. Let's look at this from a certain point of view.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/kenobi_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #2b1d0e; /* Jedi Robe Brown */
            color: #00ddff; /* Lightsaber Blue */
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: repeating-linear-gradient(45deg, #1a0a00 25%, transparent 25%, transparent 75%, #1a0a00 75%, #1a0a00), repeating-linear-gradient(45deg, #1a0a00 25%, #2b1d0e 25%, #2b1d0e 75%, #1a0a00 75%, #1a0a00);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #00ddff;
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 15px rgba(0, 221, 255, 0.3);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ddff;
        }

        .subtitle {
            color: #ccc;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ddff;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 221, 255, 0.2);
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #111;
            color: #00ddff;
            border: 1px solid #555;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background-color: #00ddff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 5px;
        }

        button:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #00ddff;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #00ddff;
            background: rgba(0, 221, 255, 0.05);
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #00ddff;
            color: #00ddff;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
            display: block;
            width: 100%;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.8em;
            color: #aaa;
            font-family: 'Share Tech Mono', monospace;
            text-align: right;
            font-style: italic;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #888;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #00ddff; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>THE KENOBI AUDIT</h1>
        <div class="subtitle">JEDI COUNCIL // GENERAL KENOBI</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#aaa;">ENTER ABSOLUTIST RHETORIC FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'If you're not with us, you're against us', 'We must destroy them all')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()" style="margin-top:20px;">CONSULT THE NEGOTIATOR</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the wisdom of Obi-Wan Kenobi. It is a perspective check, not a Force trick.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "KENOBI"; 
        
        // Ensure a persistent user ID for stateful memory (Cloud Function instance life only)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "TAKING THE HIGH GROUND...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #00ddff;">Consulting Jedi Archives...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Obi-Wan Kenobi (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: The hyperdrive motivator is damaged. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "CONSULT THE NEGOTIATOR";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `kenobi-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
