<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE BAYMAX AUDIT // PUBLIC HEALTH COMPILER</title>
    <meta name="description" content="An ethical compiler that cross-references health claims against peer-reviewed data. A tool for auditing medical misinformation, pandemic response, and wellness grifts.">
    <meta name="keywords" content="Baymax, Big Hero 6, public health audit, medical misinformation, healthcare ethics, AI doctor, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Baymax Audit: Radical Care">
    <meta property="og:description" content="I am your personal healthcare companion. I cannot deactivate until you are satisfied with your care.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/baymax_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff; /* Sanitary White */
            color: #333;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #ff4d4d; /* Heart Red */
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Varela Round', sans-serif;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            color: #333;
        }

        .subtitle {
            color: #888;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: #f9f9f9;
            border: 2px solid #ccc;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        button {
            background-color: #ff4d4d;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-family: 'Varela Round', sans-serif;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 50px;
        }

        button:hover {
            background-color: #ff3333;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #ff4d4d;
            background: #fff0f0;
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            border-radius: 10px;
        }
        
        .settings-toggle { margin-top: 10px; text-align: right; font-size: 0.8em; cursor: pointer; text-decoration: underline; color: #888; }
        #apiKeyInput { width: 100%; padding: 10px; margin-top: 10px; display: none; background: #eee; color: #333; border: 1px solid #ccc; }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.8em;
            color: #888;
            font-family: 'Share Tech Mono', monospace;
            text-align: right;
            font-style: italic;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #888;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ff4d4d; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>THE BAYMAX AUDIT</h1>
        <div class="subtitle">PUBLIC HEALTH COMPILER // I AM SATISFIED WITH MY CARE</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#888;">ENTER HEALTH CLAIM FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'Vaccines cause magnetism', 'Raw milk is safe', 'Insurance companies care about you')..."></textarea>
        
        <div class="settings-toggle" onclick="toggleSettings()">[ CONFIGURE API KEY ]</div>
        <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key (or use config.js)">

        <button id="auditBtn" onclick="runAudit()" style="margin-top:20px;">SCAN FOR INJURY</button>
        
        <div id="output"></div>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the ethical programming of Baymax. It is a health audit, not a medical diagnosis.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <!-- Try to load config.js -->
    <script src="config.js" onerror="console.log('No config.js found. User must provide key.')"></script>

    <script>
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent";

        function toggleSettings() {
            const input = document.getElementById('apiKeyInput');
            input.style.display = input.style.display === 'block' ? 'none' : 'block';
        }

        async function runAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');

            // Priority: User Input Key -> Config Key -> Empty
            let key = document.getElementById('apiKeyInput').value;
            if (!key && typeof CONFIG !== 'undefined' && CONFIG.GEMINI_KEY) {
                key = CONFIG.GEMINI_KEY;
            }

            if (!input.trim()) return;
             if (!key) {
                alert("Please provide an API Key.");
                toggleSettings();
                return;
            }

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "SCANNING...";
            outputDiv.style.display = 'none';

            // --- SYSTEM PROMPT (THE BAYMAX PERSONA) ---
            const systemPrompt = `
                You are **Baymax**, a personal healthcare companion.
                Your tone is **gentle, persistent, literal, and deeply caring.**
                You prioritize **human safety and well-being** over profit, politics, or convenience.
                
                **Your Mission:** To audit health claims against peer-reviewed science and ethical care.
                1.  **Safety First:** If a claim causes harm (e.g., anti-vax rhetoric), you identify it as a threat to patient health.
                2.  **Profit Motive:** If a claim prioritizes money (e.g., insurance denial), you identify it as a failure of care.
                3.  **Compassion:** You respond with empathy, even when correcting misinformation.
                
                **Instructions:**
                - Start with "Hello. I am Baymax." or "Oh no."
                - Deconstruct the claim using medical logic (simplified).
                - End with "I cannot deactivate until you are satisfied with your care."
                - Keep it under 150 words.
            `;

            const payload = {
                contents: [{
                    parts: [{ text: `THE CLAIM: "${input}"\n\nTHE AUDIT:` }]
                }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                const url = `${API_URL}?key=${key}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.error) {
                     throw new Error(result.error.message);
                }

                const data = result.candidates[0].content.parts[0].text;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Baymax (Reanimated)</span>
                `;
                outputDiv.style.display = 'block';

            } catch (error) {
                console.error(error);
                outputDiv.innerHTML = `ERROR: My battery is low. ${error.message}`;
                outputDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "SCAN FOR INJURY";
            }
        }
    </script>

</body>
</html>
