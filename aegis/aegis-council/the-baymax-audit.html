<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>THE BAYMAX AUDIT // PUBLIC HEALTH COMPILER</title>
    <meta name="description" content="An ethical compiler that cross-references health claims against peer-reviewed data. A tool for auditing medical misinformation, pandemic response, and wellness grifts.">
    <meta name="keywords" content="Baymax, Big Hero 6, public health audit, medical misinformation, healthcare ethics, AI doctor, TLU">
    
    <!-- OPEN GRAPH -->
    <meta property="og:title" content="The Baymax Audit: Radical Care">
    <meta property="og:description" content="I am your personal healthcare companion. I cannot deactivate until you are satisfied with your care.">
    <meta property="og:image" content="https://synapsecomics.com/aegis/assets/baymax_card.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff; /* Sanitary White */
            color: #333;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #ff4d4d; /* Heart Red */
            padding-bottom: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Varela Round', sans-serif;
            font-size: 3em;
            margin: 0;
            text-transform: uppercase;
            color: #333;
        }

        .subtitle {
            color: #888;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: #f9f9f9;
            border: 2px solid #ccc;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        button {
            background-color: #ff4d4d;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-family: 'Varela Round', sans-serif;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            border-radius: 50px;
        }

        button:hover {
            background-color: #ff3333;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            border-left: 6px solid #ff4d4d;
            background: #fff0f0;
            display: none;
            line-height: 1.6;
            font-size: 1.2em;
            border-radius: 10px;
        }
        
        .download-btn {
            background-color: transparent;
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            margin-top: 10px;
            font-size: 0.8em;
            padding: 5px 10px;
            display: block;
            width: 100%;
        }

        .source {
            display: block;
            margin-top: 15px;
            font-size: 0.8em;
            color: #888;
            font-family: 'Share Tech Mono', monospace;
            text-align: right;
            font-style: italic;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #888;
            font-size: 0.8em;
            text-align: center;
        }
        
        a { color: #ff4d4d; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>THE BAYMAX AUDIT</h1>
        <div class="subtitle">PUBLIC HEALTH COMPILER // I AM SATISFIED WITH MY CARE</div>
    </header>

    <div class="input-container">
        <label for="inputClaim" style="display:block; margin-bottom:10px; color:#888;">ENTER HEALTH CLAIM FOR REVIEW:</label>
        <textarea id="inputClaim" placeholder="Paste the claim here (e.g., 'Vaccines cause magnetism', 'Raw milk is safe', 'Insurance companies care about you')..."></textarea>
        
        <button id="auditBtn" onclick="runAegisAudit()" style="margin-top:20px;">SCAN FOR INJURY</button>
        
        <div id="output"></div>
        <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadLog()">DOWNLOAD TRANSCRIPT</button>
    </div>

    <footer>
        <p>DISCLAIMER: This tool uses the Mark VII Language Model. It channels the ethical programming of Baymax. It is a health audit, not a medical diagnosis.</p>
        <p><a href="index.html">RETURN TO COUNCIL</a></p>
    </footer>

    <script>
        // --- AEGIS CORE CONFIGURATION ---
        const CLOUD_FUNCTION_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
        const NODE_ID = "BAYMAX"; 
        
        // Ensure a persistent user ID for stateful memory (Cloud Function instance life only)
        let USER_ID = localStorage.getItem('aegis_user_id');
        if (!USER_ID) {
            USER_ID = 'user_' + Date.now() + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('aegis_user_id', USER_ID);
        }

        let lastAuditText = "";

        async function runAegisAudit() {
            const input = document.getElementById('inputClaim').value;
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('auditBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!input.trim()) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "SCANNING...";
            outputDiv.style.display = 'block';
            outputDiv.innerHTML = '<span style="color: #ff4d4d;">Running 10,000 health scans...</span>';
            downloadBtn.style.display = 'none';

            // The input text is sent directly as the chat_text. The persona prompt is handled by the backend (main.py).
            const payload = {
                node_id: NODE_ID,
                user_id: USER_ID,
                chat_text: input
            };

            try {
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                const data = await response.text();
                
                lastAuditText = `CLAIM [${NODE_ID}]: ${input}\nAUDIT: ${data}`;

                // UI State: Success
                outputDiv.innerHTML = `
                    ${data.replace(/\n/g, '<br>')}
                    <span class="source">— Baymax (Reanimated)</span>
                `;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Audit Failed:", error);
                outputDiv.innerHTML = `ERROR: My battery is low. ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "SCAN FOR INJURY";
            }
        }
        
        function downloadLog() {
            if (!lastAuditText) return;
            const blob = new Blob([lastAuditText], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = `baymax-audit-${Date.now()}.txt`;
            anchor.href = window.URL.createObjectURL(blob);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
</html>
