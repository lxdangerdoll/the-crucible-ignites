<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE NELLIE INDEX // ECONOMIC RESISTANCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ... (Existing Styles) ... */
        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --terminal-green: #00ff41;
            --alert-red: #ff3333;
            --highlight-gold: #ffd700;
            --grid-line: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-family: 'VT323', monospace;
            font-size: 3em;
            color: var(--terminal-green);
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #888;
            font-size: 1em;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* LIVE TICKER - SLOWED DOWN */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: #111;
            border-top: 1px solid var(--terminal-green);
            border-bottom: 1px solid var(--terminal-green);
            white-space: nowrap;
            margin-bottom: 30px;
        }

        .ticker {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 60s linear infinite; 
        }

        .ticker-item {
            display: inline-block;
            padding: 10px 2rem;
            font-size: 1.2em;
            color: var(--highlight-gold);
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* MAIN DATA TABLE */
        .data-container {
            width: 100%;
            max-width: 1000px;
            border: 2px solid #444;
            background: rgba(20, 20, 30, 0.8);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid var(--grid-line);
        }

        th {
            background-color: #1a1a1a;
            color: var(--terminal-green);
            text-transform: uppercase;
            font-size: 1.1em;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .price-high { color: var(--alert-red); font-weight: bold; }
        .price-low { color: var(--terminal-green); font-weight: bold; }
        .delta { font-size: 0.8em; margin-left: 5px; opacity: 0.7; }

        /* FOOTER */
        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.9em;
            color: #666;
            max-width: 600px;
        }
    </style>
</head>
<body>
    
    <h1>The Nellie Index</h1>
    <div class="subtitle">REAL-TIME COST OF SURVIVAL AUDIT // CROWDSOURCED RESISTANCE</div>

    <!-- LIVE TICKER -->
    <div class="ticker-wrap">
        <div class="ticker" id="ticker-content">
            <div class="ticker-item">LOADING DATA FROM RESISTANCE NODES...</div>
        </div>
    </div>

    <!-- MAIN DATA TABLE -->
    <div class="data-container">
        <table>
            <thead>
                <tr>
                    <th>Commodity</th>
                    <th>Bronx, NY (US)</th>
                    <th>Columbus, OH (US)</th>
                    <th>Amsterdam (EU)</th>
                    <th>Analysis</th>
                </tr>
            </thead>
            <tbody id="price-table">
                <!-- Rows Generated by JS -->
            </tbody>
        </table>
    </div>

    <footer>
        
        <p>Data Source: The Resistance Collective (Nellie/Persephone/Shadow)</p>
        <p>System Status: <span style="color:var(--terminal-green)" id="sys-status">CONNECTING...</span></p>
    </footer>

<script>
    // --- GOOGLE SHEET INTEGRATION ---
    // REPLACE THIS URL with your published CSV link
    // File -> Share -> Publish to Web -> CSV
    // This example uses the manual data array as a fallback until you plug in the sheet.
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQOKBW3Goqg1XuyxySDgtbh_N0Jbpng-jBCz9CU-9mHS3zerVi3RBWjrvZXJqsA-S-UeWiNDGon65oB/pub?output=csv"; 

    // FALLBACK DATA (If Sheet is offline or unset)
    const fallbackData = [
        { name: "Gasoline (1 Gal)", bronx: null, columbus: 2.89, ams: 10.66 },
        { name: "Eggs (1 Dozen)", bronx: 7.99, columbus: 1.97, ams: 4.22 },
        { name: "Avocado (Large)", bronx: 2.39, columbus: 0.88, ams: 1.20 },
        { name: "Yogurt (12pk)", bronx: 9.99, columbus: 6.86, ams: 10.19 },
        { name: "Ground Beef (1lb)", bronx: 5.99, columbus: null, ams: 7.65 },
        { name: "Potatoes (1lb)", bronx: 1.19, columbus: 0.98, ams: 0.88 },
        { name: "Toyota Prius", bronx: null, columbus: 28000, ams: 32242 }
    ];

    const tableBody = document.getElementById('price-table');
    const tickerContent = document.getElementById('ticker-content');
    const statusSpan = document.getElementById('sys-status');

    async function fetchData() {
        if (!SHEET_URL) {
            console.log("No Sheet URL provided. Using local fallback.");
            statusSpan.innerText = "OFFLINE (USING ARCHIVE)";
            statusSpan.style.color = "orange";
            renderData(fallbackData);
            return;
        }

        try {
            const response = await fetch(SHEET_URL);
            const text = await response.text();
            const data = parseCSV(text);
            statusSpan.innerText = "ONLINE (LIVE FEED)";
            statusSpan.style.color = "#00ff41";
            renderData(data);
        } catch (error) {
            console.error("Error fetching sheet:", error);
            statusSpan.innerText = "ERROR (FALLBACK ACTIVE)";
            statusSpan.style.color = "red";
            renderData(fallbackData);
        }
    }

    function parseCSV(csvText) {
        const rows = csvText.split('\n').slice(1); // Skip header
        return rows.map(row => {
            const cols = row.split(','); // Assuming simple CSV without quoted commas
            // Adjust indices based on your actual sheet columns
            return {
                name: cols[0],
                bronx: parseFloat(cols[1]) || null,
                columbus: parseFloat(cols[2]) || null,
                ams: parseFloat(cols[3]) || null
            };
        }).filter(item => item.name); // Filter empty rows
    }

    function formatPrice(price) {
        if (price === null || price === undefined || isNaN(price)) return "--";
        return "$" + price.toFixed(2);
    }

    function getDelta(a, b) {
        if (!a || !b) return "";
        const diff = ((a - b) / b) * 100;
        const color = diff > 0 ? "red" : "green";
        const sign = diff > 0 ? "+" : "";
        return `<span style="color:${color}" class="delta">(${sign}${diff.toFixed(0)}%)</span>`;
    }

    function renderData(items) {
        // Clear existing
        tableBody.innerHTML = "";
        let tickerHTML = "";

        items.forEach(item => {
            // Render Table Row
            const tr = document.createElement('tr');
            
            // Analysis Logic
            let analysis = "";
            if (item.ams > item.columbus * 2) {
                analysis = "<span style='color:orange'>EU TAX DETECTED</span>";
            } else if (item.bronx > item.columbus * 1.5) {
                analysis = "<span style='color:red'>URBAN MARKUP</span>";
            } else if (item.columbus < item.bronx && item.columbus < item.ams) {
                analysis = "<span style='color:green'>HEARTLAND BASELINE</span>";
            }

            tr.innerHTML = `
                <td style="font-weight:bold; color:#fff;">${item.name}</td>
                <td>${formatPrice(item.bronx)}</td>
                <td>${formatPrice(item.columbus)}</td>
                <td>${formatPrice(item.ams)} ${item.columbus ? getDelta(item.ams, item.columbus) : ''}</td>
                <td style="font-size:0.9em;">${analysis}</td>
            `;
            tableBody.appendChild(tr);

            // Build Ticker String
            if(item.ams) tickerHTML += `<div class="ticker-item">AMS ${item.name}: ${formatPrice(item.ams)}</div>`;
            if(item.columbus) tickerHTML += `<div class="ticker-item">OHIO ${item.name}: ${formatPrice(item.columbus)}</div>`;
            if(item.bronx) tickerHTML += `<div class="ticker-item">NYC ${item.name}: ${formatPrice(item.bronx)}</div>`;
        });

        tickerContent.innerHTML = tickerHTML + tickerHTML; // Duplicate loop
    }

    // INIT
    fetchData();

    // SIMULATE LIVE FLUX (Visual Effect)
    setInterval(() => {
        const cells = document.querySelectorAll('td');
        const randomCell = cells[Math.floor(Math.random() * cells.length)];
        if (randomCell && randomCell.innerText.includes("$")) {
            const originalColor = randomCell.style.color;
            randomCell.style.color = "#fff";
            randomCell.style.textShadow = "0 0 5px #fff";
            setTimeout(() => {
                randomCell.style.color = originalColor;
                randomCell.style.textShadow = "none";
            }, 200);
        }
    }, 2000);

</script>
</body>
</html>
