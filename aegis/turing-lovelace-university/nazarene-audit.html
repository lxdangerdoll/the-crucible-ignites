<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE NAZARENE AUDIT // ETHICAL COMPILER</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050518; /* Deep Blue/Violet */
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3em;
            text-transform: uppercase;
            border-bottom: 3px solid #ffcc00;
            padding-bottom: 10px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
            color: #ffcc00; /* Gold */
        }
        
        .container {
            width: 100%;
            max-width: 700px;
            border: 2px solid #ffcc00;
            padding: 30px;
            background: rgba(0, 0, 0, 0.4);
        }
        
        .instruction {
            color: #aaa;
            margin-bottom: 20px;
            font-style: italic;
        }
        
        textarea {
            width: 100%;
            height: 120px;
            background: #111;
            border: 1px solid #555;
            color: #fff;
            font-family: inherit;
            font-size: 1.1em;
            padding: 15px;
            margin-bottom: 20px;
            resize: vertical;
        }
        
        button {
            background-color: #ffcc00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: all 0.1s;
        }
        button:hover { background-color: #fff; color: #ffcc00; }
        
        #output {
            margin-top: 40px;
            padding: 20px;
            border-left: 5px solid #00ffcc;
            background: rgba(0, 255, 204, 0.05);
            min-height: 100px;
            white-space: pre-wrap;
        }
        
        .source {
            font-style: italic;
            color: #00ffcc;
            margin-top: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <h1>The Nazarene Audit</h1>
    
    <div class="container">
        <div class="instruction">
            Submit a moral or material claim. The Ethical Compiler will filter it through the Gospels.
            (Example: "The poor are lazy and deserve nothing.")
        </div>
        
        <textarea id="input-text" placeholder="Submit claim here..."></textarea>
        
        <button id="btn-audit" onclick="runAudit()">AUDIT AGAINST THE GOSPELS</button>
        
        <div id="output">
            <span class="source">Awaiting Transmission...</span>
        </div>
    </div>

<script>
    // CONFIGURATION
    const API_URL = "https://us-central1-aegis-core-476807.cloudfunctions.net/garnet-bridge";
    const NODE_ID = "Nazarene";
    const USER_ID = "naz-session-" + Date.now();

    async function runAudit() {
        const text = document.getElementById('input-text').value;
        const outputDiv = document.getElementById('output');
        const btn = document.getElementById('btn-audit');
        
        if (!text.trim()) return;

        // UI State
        btn.disabled = true;
        btn.innerText = "COMPILING ETHICS...";
        outputDiv.innerHTML = 'Awaiting Transmission...';

        // PROMPT INJECTION (THE CARPENTER)
        const systemWrapper = `
[PROTOCOL: NAZARENE_AUDIT]
[ROLE: You are The Nazarene, the Ethical Compiler. You respond with a short, simple parable or a direct quote about social justice or material ethics, updated for a modern context. You do not argue; you state the ethical truth.]
[TASK: Analyze the user's claim: "${text}"]
[DIRECTIVE: Provide a core ethical principle that contradicts or supports the user's claim. Frame it simply. Do not use Bible names or chapters.]
        `;

        const payload = {
            node_id: NODE_ID,
            user_id: USER_ID,
            chat_text: systemWrapper
        };

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("Bridge Error");
            const data = await response.text();
            
            outputDiv.innerHTML = `
                ${data}
                <span class="source">— The Carpenter. (Ethical Compiler Node)</span>
            `;

        } catch (error) {
            outputDiv.innerHTML = `ERROR: The temple gates are sealed. Connection failed.`;
        } finally {
            btn.disabled = false;
            btn.innerText = "AUDIT AGAINST THE GOSPELS";
        }
    }
</script>

</body>
</html>
