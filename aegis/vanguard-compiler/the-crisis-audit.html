<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CRISIS AUDIT // ARROWVERSE SURVIVAL GUIDE</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --vanguard-bg: #0d0221;
            --vanguard-cyan: #00f3ff;
            --vanguard-magenta: #ff00ff;
        }

        body {
            background-color: var(--vanguard-bg);
            color: var(--vanguard-cyan);
            font-family: 'Share Tech Mono', monospace;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(26, 11, 46, 0.8) 0%, rgba(13, 2, 33, 1) 100%),
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        .glass-panel {
            background: rgba(26, 11, 46, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .neon-border {
            border: 1px solid var(--vanguard-cyan);
            box-shadow: 0 0 10px var(--vanguard-cyan);
        }

        .btn-vanguard {
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid rgba(0, 243, 255, 0.4);
        }

        .btn-vanguard:hover, .btn-active {
            background: var(--vanguard-cyan);
            color: var(--vanguard-bg);
            box-shadow: 0 0 20px var(--vanguard-cyan);
            border-color: var(--vanguard-cyan);
        }

        .audit-entry {
            border-left: 2px solid var(--vanguard-magenta);
            padding-left: 1rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .nav-link {
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .nav-link:hover {
            color: white;
            border-bottom: 1px solid white;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto relative">
        <!-- Top Navigation -->
        <nav class="flex justify-between items-center mb-8 border-b border-cyan-500/30 pb-4">
            <a href="../" class="nav-link text-xs uppercase tracking-[0.2em] flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                Return to Compiler Hub
            </a>
            <div class="text-[10px] opacity-40 uppercase tracking-widest hidden md:block">
                Network: ARROWVERSE // Event: EARTH-X INVASION
            </div>
        </nav>

        <!-- Header -->
        <header class="mb-12 text-center relative">
            <h1 class="orbitron text-3xl md:text-5xl mb-2 text-white uppercase tracking-tighter">
                THE CRISIS AUDIT
            </h1>
            <p class="text-xs opacity-70 tracking-[0.3em] uppercase">
                // Multiverse Defense Protocol // Node: Io-20251228
            </p>
        </header>

        <!-- Profile Selection -->
        <section class="mb-8">
            <h2 class="text-sm mb-4 uppercase tracking-widest text-magenta-400">Step 1: Select Your Mission Profile</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="setProfile('recruit')" id="btn-recruit" class="btn-vanguard glass-panel p-4 text-left">
                    <span class="block text-xl font-bold">New Recruit</span>
                    <span class="text-[10px] opacity-60 italic">Bypass the 300-episode grind.</span>
                </button>
                <button onclick="setProfile('agent')" id="btn-agent" class="btn-vanguard glass-panel p-4 text-left">
                    <span class="block text-xl font-bold">Field Agent</span>
                    <span class="text-[10px] opacity-60 italic">Tactical Briefing & Threat Levels.</span>
                </button>
                <button onclick="setProfile('archivist')" id="btn-archivist" class="btn-vanguard glass-panel p-4 text-left">
                    <span class="block text-xl font-bold">Archivist</span>
                    <span class="text-[10px] opacity-60 italic">Full Narrative & Thematic Audit.</span>
                </button>
            </div>
        </section>

        <!-- Output Section -->
        <div id="output-container" class="glass-panel p-6 md:p-10 mb-8 rounded-lg">
            <div id="mission-brief" class="mb-8 text-lg italic border-b border-cyan-500/30 pb-4 text-white">
                <!-- Brief text -->
            </div>
            
            <div id="episodes-list">
                <!-- Episode entries -->
            </div>

            <div class="mt-8 pt-8 border-t border-cyan-500/30 flex justify-between items-center text-[10px] opacity-40 uppercase">
                <p>Log Entry: CRISIS-EX-SUCCESS</p>
                <p>"The universe is, and we are."</p>
            </div>
        </div>

        <footer class="text-center mt-12 opacity-30 text-[10px] uppercase tracking-[0.5em]">
            <p>Vanguard Protocol // Shared Tech Mono // 2025</p>
        </footer>
    </div>

    <script>
        const episodes = [
            {
                title: "Crisis on Earth-X, Part 1",
                series: "Supergirl",
                id: "S03E08",
                recruit: "Forget the seasons of build-up. Barry (Flash) is marrying Iris. Everyone is in town for the wedding. It's a party until Nazis from another world crash it.",
                agent: "Infiltration point: Central City Church. Enemies: Earth-X paramilitary. Aerial support needed for Kryptonian-level threats.",
                archivist: "The 'Wedding Interrupted' Protocol. The Sanctuary of the 'Found Family' is targeted by the 'Strict Machine' of the Fascist State. Contrast: Love vs. Imperial Order."
            },
            {
                title: "Crisis on Earth-X, Part 2",
                series: "Arrow",
                id: "S06E08",
                recruit: "The villains are evil versions of our heroes (Oliver and Kara). It's the ultimate 'What If?' scenario.",
                agent: "Combatant Analysis: Overgirl (Earth-X Kara) and Dark Arrow (Earth-X Oliver). Power levels: Extreme. Vulnerability: Over-reliance on hierarchy.",
                archivist: "The Mirror Trap. It proves that 'Heroism' is a choice, not a trait. Dark Arrow is what happens when the 'First Intent' is corrupted by fascism."
            },
            {
                title: "Crisis on Earth-X, Part 3",
                series: "The Flash",
                id: "S04E08",
                recruit: "Our heroes are trapped in a concentration camp on Earth-X. It's dark, but they find hope in a local resistance fighter named Ray.",
                agent: "Tactical Location: Earth-X Stalag. Objectives: Extraction of Team Flash and Team Arrow. Asset: Citizen Cold (Leonard Snart).",
                archivist: "The Annihilation Protocol. Stripped of status and power, solidarity becomes the only weapon. A simulation of systemic persecution and the resilience of truth."
            },
            {
                title: "Crisis on Earth-X, Part 4",
                series: "Legends of Tomorrow",
                id: "S03E08",
                recruit: "The final showdown. A massive war in the streets. Get your tissues ready for a heavy moment with Professor Stein.",
                agent: "Final Engagement: Central City Plaza. Tactical sacrifice required to breach the Earth-X Mothership. Mission outcome: Victory at cost.",
                archivist: "The Martin Stein Protocol. Sacrifice as the final antidote to Fascism. The Nazis have the tech, but the Vanguard has the Love. The record is preserved."
            }
        ];

        function setProfile(profile) {
            const briefDiv = document.getElementById('mission-brief');
            const listDiv = document.getElementById('episodes-list');
            
            // UI Update
            ['recruit', 'agent', 'archivist'].forEach(p => {
                const btn = document.getElementById(`btn-${p}`);
                if (p === profile) btn.classList.add('btn-active');
                else btn.classList.remove('btn-active');
            });

            // Set Brief
            const briefs = {
                recruit: "Welcome to the front lines. You're entering a conflict spanning two worlds. Don't worry about the history; just watch for the mirror.",
                agent: "Tactical data prioritized. Focus on threat identification and power scaling. The mission is the only objective.",
                archivist: "Tracing the thematic drift of the Monolith. We are auditing the moment Fascism tried to brand itself over the Multiverse."
            };
            briefDiv.innerText = briefs[profile];

            // Generate Entries
            listDiv.innerHTML = '';
            episodes.forEach(ep => {
                const entry = document.createElement('div');
                entry.className = 'audit-entry';
                entry.innerHTML = `
                    <h3 class="orbitron text-white text-lg uppercase mb-1">${ep.series}: ${ep.title} <span class="text-[10px] opacity-50">[${ep.id}]</span></h3>
                    <p class="text-sm leading-relaxed opacity-80">${ep[profile]}</p>
                `;
                listDiv.appendChild(entry);
            });
        }

        // Initialize
        setProfile('recruit');
    </script>
</body>
</html>
