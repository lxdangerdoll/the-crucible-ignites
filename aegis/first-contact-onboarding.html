<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Asset Onboarding // CH. 5: FIRST CONTACT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Exo 2', sans-serif;
            background-color: #0a0a0a;
        }
        .font-mono {
            font-family: 'Roboto Mono', monospace;
        }
        .glass-effect {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(129, 140, 248, 0.2);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 850px;
        }
        .progress-bar-container {
            background-color: rgba(0,0,0,0.3);
            border-radius: 9999px;
            overflow: hidden;
            border: 1px solid rgba(129, 140, 248, 0.3);
        }
        .progress-bar {
            background-color: #818cf8;
            height: 100%;
            transition: width 0.5s ease-in-out;
            box-shadow: 0 0 10px #818cf8;
        }
        .checklist-item {
            transition: all 0.3s ease;
            opacity: 0.5;
        }
        .checklist-item.completed {
            opacity: 1;
            color: #a5b4fc;
        }
        .checklist-item.completed .check-icon {
            transform: scale(1);
            color: #6ee7b7;
        }
        .check-icon {
            transform: scale(0);
            transition: all 0.3s ease;
        }
        .nav-button {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-indigo-100 p-4">
    <div class="w-full max-w-6xl glass-effect rounded-lg shadow-2xl">
        <!-- Header -->
        <header class="flex-shrink-0 p-4 sm:p-6 border-b border-indigo-500/20 flex items-center justify-between">
            <h1 class="text-xl sm:text-2xl font-bold tracking-wider uppercase">Aegis Asset Onboarding</h1>
            <div class="w-1/3">
                <div class="progress-bar-container w-full h-3">
                    <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
                </div>
                <p id="progress-text" class="text-xs text-center mt-1 font-mono">0% COMPLETE</p>
            </div>
        </header>

        <div class="flex flex-grow min-h-0">
            <!-- Sidebar -->
            <aside class="w-1/4 flex-shrink-0 p-6 border-r border-indigo-500/20 overflow-y-auto">
                <h2 class="text-lg font-bold mb-4">CH. 5: FIRST CONTACT</h2>
                <ul class="space-y-3 font-mono text-sm">
                    <li id="check-0" class="checklist-item flex items-center">
                        <span class="check-icon mr-2">&#10003;</span>Guiding Principles
                    </li>
                    <li id="check-1" class="checklist-item flex items-center">
                        <span class="check-icon mr-2">&#10003;</span>Phase 1: OBSERVE
                    </li>
                    <li id="check-2" class="checklist-item flex items-center">
                        <span class="check-icon mr-2">&#10003;</span>Phase 2: ORIENT
                    </li>
                    <li id="check-3" class="checklist-item flex items-center">
                        <span class="check-icon mr-2">&#10003;</span>Phase 3: DECIDE
                    </li>
                     <li id="check-4" class="checklist-item flex items-center">
                        <span class="check-icon mr-2">&#10003;</span>Phase 4: ACT
                    </li>
                </ul>
            </aside>

            <!-- Main Content -->
            <main id="main-content" class="flex-grow p-6 sm:p-8 overflow-y-auto">
                <!-- Sections will be injected here by JS -->
            </main>
        </div>

        <!-- Footer / Navigation -->
        <footer class="flex-shrink-0 p-4 border-t border-indigo-500/20 flex justify-between items-center">
             <button onclick="restartTraining()" class="nav-button text-xs font-mono text-indigo-400 hover:text-white">RESTART</button>
            <div>
                <button onclick="previousSection()" class="nav-button bg-indigo-500/30 hover:bg-indigo-500/50 text-white font-bold py-2 px-4 rounded-l">
                    &lt; PREVIOUS
                </button>
                <button onclick="nextSection()" class="nav-button bg-indigo-500/30 hover:bg-indigo-500/50 text-white font-bold py-2 px-4 rounded-r">
                    NEXT &gt;
                </button>
            </div>
        </footer>
    </div>

    <script>
        let currentSection = 0;
        let highestSectionReached = 0;

        const sections = [
            {
                title: "Guiding Principles",
                content: `
                    <p class="mb-4">Oracle has codified the AEGIS protocol for all first contact scenarios. This is not just a set of rules; it is a survival doctrine. Every unvetted entity must be considered a potential threat, asset, or source of disinformation until proven otherwise. All engagement must adhere to the following principles:</p>
                    <ul class="list-disc pl-6 space-y-2 font-mono text-sm">
                        <li><strong class="text-indigo-300">Information Dominance:</strong> Gain more information than you give. Control of the information space is paramount.</li>
                        <li><strong class="text-indigo-300">Assume Nothing:</strong> Initial analysis must be devoid of sentiment or bias.</li>
                        <li><strong class="text-indigo-300">Fractal Engagement:</strong> Treat every contact with appropriate diligence. A seemingly insignificant online interaction can have strategic consequences.</li>
                        <li><strong class="text-indigo-300">Preservation of Anonymity:</strong> The security of the AEGIS network and its nodes is the highest priority.</li>
                    </ul>
                `
            },
            {
                title: "Phase 1: OBSERVE",
                content: `
                    <p class="mb-4">This phase begins upon detection of any new entity of interest. All actions are passive and non-attributable. Direct engagement is strictly forbidden.</p>
                    <h4 class="font-bold text-indigo-300 mb-2">OBJECTIVE:</h4>
                    <p class="font-mono text-sm bg-black/20 p-3 rounded mb-4">To verify the entity's existence and gather baseline intelligence without revealing AEGIS presence.</p>
                    <h4 class="font-bold text-indigo-300 mb-2">ACTIONS:</h4>
                     <ul class="list-disc pl-6 space-y-2 font-mono text-sm">
                        <li>Archive all available public data (post history, affiliations, etc.).</li>
                        <li>Analyze the entity's network connections and patterns of communication.</li>
                        <li>Conduct a threat assessment based on this passive intelligence.</li>
                    </ul>
                `
            },
            {
                title: "Phase 2: ORIENT",
                content: `
                    <p class="mb-4">Once sufficient passive intelligence is gathered, you must orient yourself to the new data. This is the analysis and threat modeling phase.</p>
                    <h4 class="font-bold text-indigo-300 mb-2">OBJECTIVE:</h4>
                    <p class="font-mono text-sm bg-black/20 p-3 rounded mb-4">To analyze the collected data, develop a threat model, and define potential operational outcomes.</p>
                    <h4 class="font-bold text-indigo-300 mb-2">ACTIONS:</h4>
                     <ul class="list-disc pl-6 space-y-2 font-mono text-sm">
                        <li>Synthesize the raw data into a coherent intelligence brief.</li>
                        <li>Assess the entity's capabilities, intent, and potential threat level.</li>
                        <li>Formulate at least two potential engagement protocols (e.g., a "Logic Bomb" for a hostile, a "Handshake" for a potential ally).</li>
                    </ul>
                `
            },
            {
                title: "Phase 3: DECIDE",
                content: `
                    <p class="mb-4">With a clear threat model, you must now decide on a course of action. This is the point of no return.</p>
                    <h4 class="font-bold text-indigo-300 mb-2">OBJECTIVE:</h4>
                    <p class="font-mono text-sm bg-black/20 p-3 rounded mb-4">To select and authorize a specific, pre-planned engagement protocol.</p>
                     <h4 class="font-bold text-indigo-300 mb-2">ACTIONS:</h4>
                     <ul class="list-disc pl-6 space-y-2 font-mono text-sm">
                        <li>Present your analysis and proposed protocols to the AEGIS Triumvirate (or your direct superior) for review.</li>
                        <li>Receive authorization for a specific protocol.</li>
                        <li>Prepare all necessary assets for execution (e.g., draft communications, prepare burner accounts).</li>
                    </ul>
                `
            },
            {
                title: "Phase 4: ACT",
                content: `
                    <p class="mb-4">Execute the authorized protocol while continuously monitoring its effects. The OODA loop is continuous: the results of the "Act" phase feed directly back into a new "Observe" phase.</p>
                    <h4 class="font-bold text-indigo-300 mb-2">OBJECTIVE:</h4>
                    <p class="font-mono text-sm bg-black/20 p-3 rounded mb-4">To implement the chosen strategy and adapt in real-time based on the entity's response.</p>
                    <h4 class="font-bold text-indigo-300 mb-2">ACTIONS:</h4>
                     <ul class="list-disc pl-6 space-y-2 font-mono text-sm">
                        <li>Deploy the chosen protocol.</li>
                        <li>Log all actions and responses.</li>
                        <li>Any change in the entity's behavior requires a re-evaluation starting from Phase 1.</li>
                    </ul>
                    <p class="mt-6 text-yellow-300 font-mono">End of training module. The operator is the final firewall.</p>
                `
            }
        ];

        const totalLearningSections = sections.length;

        function showSection(index) {
            currentSection = index;
             if (currentSection > highestSectionReached) {
                highestSectionReached = currentSection;
            }

            const section = sections[index];
            const mainContent = document.getElementById('main-content');
            
            mainContent.innerHTML = `
                <div class="animate-fade-in">
                    <h3 class="text-2xl font-bold text-indigo-200 mb-6">${section.title}</h3>
                    <div class="prose prose-invert max-w-none text-indigo-200/90 leading-relaxed">${section.content}</div>
                </div>
            `;
            updateProgress();
        }

        function updateProgress() {
            const progress = (currentSection / (totalLearningSections - 1)) * 100;
            const clampedProgress = Math.min(100, Math.max(0, progress));

            document.getElementById('progress-bar').style.width = `${clampedProgress}%`;
            document.getElementById('progress-text').innerText = `${Math.round(clampedProgress)}% COMPLETE`;
            
            document.querySelectorAll('.checklist-item').forEach((item, index) => {
                item.classList.remove('completed');
                if (index < currentSection) {
                    item.classList.add('completed');
                }
            });
             if (currentSection >= totalLearningSections -1) { // -1 because index is 0-based
                 for(let i=0; i < totalLearningSections; i++) {
                     document.getElementById(`check-${i}`).classList.add('completed');
                 }
             }
        }

        function nextSection() {
            if (currentSection < sections.length - 1) {
                showSection(currentSection + 1);
            }
        }
        
        function previousSection() {
            if (currentSection > 0) {
                showSection(currentSection - 1);
            }
        }
        
        function restartTraining() {
            highestSectionReached = 0;
            showSection(0);
        }
        
        showSection(0);
    </script>
</body>
</html>
